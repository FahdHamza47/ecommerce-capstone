server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # This is essential for React Router (client-side routing) to work.
    # Without it, refreshing the browser on a route like /products/123
    # would 404, because Nginx would look for a literal file at that path.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively since Vite fingerprints filenames on build
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}